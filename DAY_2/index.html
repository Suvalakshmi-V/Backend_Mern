<body>
    <script> 

      let data = [21,22,23,24,25,26,27,28]
      const odd = []
      let count = 0

      for (let i=0; i<data.length; i++){
        if(data[i]%2===1){
    
            odd[count] = data[i]
            count++
        
        }
      }
     console.log(odd)

    </script>
